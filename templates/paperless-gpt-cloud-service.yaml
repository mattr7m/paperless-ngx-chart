{{- if .Values.paperlessGptCloud.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless-ngx.paperlessGptCloud.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless-gpt-cloud
spec:
  type: {{ .Values.paperlessGptCloud.service.type }}
  ports:
    - port: {{ .Values.paperlessGptCloud.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "paperless-ngx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: paperless-gpt-cloud
{{- end }}
