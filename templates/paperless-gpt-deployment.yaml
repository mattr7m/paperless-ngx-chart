{{- if .Values.paperlessGpt.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paperless-ngx.paperlessGpt.fullname" . }}
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless-gpt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "paperless-ngx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: paperless-gpt
  template:
    metadata:
      labels:
        {{- include "paperless-ngx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: paperless-gpt
    spec:
      containers:
        - name: paperless-gpt
          image: "{{ .Values.paperlessGpt.image.repository }}:{{ .Values.paperlessGpt.image.tag }}"
          imagePullPolicy: {{ .Values.paperlessGpt.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Paperless-ngx connection
            - name: PAPERLESS_BASE_URL
              value: "http://{{ include "paperless-ngx.fullname" . }}:{{ .Values.paperless.service.port }}"
            {{- if .Values.paperlessGpt.existingSecret.apiToken.name }}
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paperlessGpt.existingSecret.apiToken.name }}
                  key: {{ .Values.paperlessGpt.existingSecret.apiToken.key }}
            {{- end }}
            {{- if .Values.paperlessGpt.existingSecret.paperlessUsername.name }}
            - name: PAPERLESS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paperlessGpt.existingSecret.paperlessUsername.name }}
                  key: {{ .Values.paperlessGpt.existingSecret.paperlessUsername.key }}
            {{- end }}
            # User-provided env vars
            {{- range $key, $val := .Values.paperlessGpt.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          {{- with .Values.paperlessGpt.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "paperless-ngx.paperlessGpt.fullname" . }}-data
{{- end }}
