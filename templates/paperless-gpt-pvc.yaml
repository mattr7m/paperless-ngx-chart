{{- if .Values.paperlessGpt.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "paperless-ngx.paperlessGpt.fullname" . }}-data
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
    app.kubernetes.io/component: paperless-gpt
spec:
  accessModes:
    - {{ .Values.paperlessGpt.persistence.accessMode }}
  {{- if .Values.paperlessGpt.persistence.storageClass }}
  storageClassName: {{ .Values.paperlessGpt.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.paperlessGpt.persistence.size }}
{{- end }}
