{{- if .Values.openWebui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paperless-ngx.fullname" . }}-open-webui
  labels:
    {{- include "paperless-ngx.labels" . | nindent 4 }}
    app.kubernetes.io/component: open-webui
spec:
  type: {{ .Values.openWebui.service.type }}
  ports:
    - port: {{ .Values.openWebui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "paperless-ngx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: open-webui
{{- end }}
